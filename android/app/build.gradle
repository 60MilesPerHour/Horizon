plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.miles.horizon"
    compileSdk = flutter.compileSdkVersion
    // Tracks the Flutter SDK rather than being pinned. It was hardcoded to
    // 27.0.12077973 for Flutter 3.27; on 3.44 the expected version is
    // 28.2.13676358, and a plugin needing the SDK's version against a
    // hardcoded older one is a build failure. Following flutter.ndkVersion
    // means the next upgrade doesn't need this line touched at all.
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.miles.horizon"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // flutter_secure_storage requires API 23+; flutter_tts (voice mode)
        // declares 24, and the manifest merge fails outright rather than
        // warning when the app's minSdk is lower than a library's.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Overridden per build type so a test build can carry a different
        // name on the launcher.
        manifestPlaceholders["appLabel"] = "Horizon"
    }

    // ONNX Runtime (the "Hey Horizon" wake word) ships twice: the Flutter
    // plugin bundles a 2023 build (1.15.1) whose ELF segments are 4 KB
    // aligned, which Android 15+ flags as not 16 KB compatible. The app
    // carries the official 1.22 build in src/main/jniLibs instead, and the
    // app module's copy wins here. The plugin only calls ORT's C API, which
    // is versioned and backwards compatible — checked by running the wake
    // word tests against 1.22.
    packaging {
        jniLibs {
            pickFirsts += ["**/libonnxruntime.so"]
        }
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // Use release signing config if keystore exists, otherwise use debug
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }

        // A test build that lives alongside the installed app.
        //
        // The release keystore is a CI secret, so anything built on a laptop
        // is signed with a different key — and Android refuses to install
        // that over an existing app, which would mean uninstalling Horizon
        // and losing that device's chats to try a change. A suffixed
        // application id sidesteps the whole problem: `com.miles.horizon.dev`
        // is a different app as far as Android is concerned, so both sit on
        // the launcher and the real one is never touched.
        //
        // Profile rather than debug because this is for judging voice
        // latency: profile is AOT-compiled like release, where debug runs the
        // interpreter and would make every measurement a lie.
        profile {
            applicationIdSuffix = ".dev"
            versionNameSuffix = "-dev"
            manifestPlaceholders["appLabel"] = "Horizon dev"
        }
    }
}

flutter {
    source = "../.."
}
